<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TP357S Monitor</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header>
  <h1>ThermoPro TP357S Monitor</h1>
</header>
<main>
  <section class="card">
    <h2>Sensoren suchen</h2>
    <div class="toolbar">
      <label>Scan-Dauer (Sek.): <input id="scan-duration" type="number" value="8" min="2" max="30" /></label>
      <button id="scan-btn">Nach Sensoren suchen</button>
      <span id="scan-status" class="muted"></span>
    </div>
    <ul id="scan-results" class="device-list"></ul>
  </section>

  <section class="card">
    <h2>Meine Sensoren</h2>
    <p id="no-devices" class="muted">Noch keine Sensoren gekoppelt. Oben suchen und hinzufügen.</p>
    <ul id="device-list" class="device-list"></ul>
  </section>

  <section class="card">
    <h2>Verlauf</h2>
    <div class="toolbar">
      <label>Sensor: <select id="history-device"></select></label>
      <label>Anzahl Datensätze: <input id="history-count" type="number" value="500" min="1" max="5000" /></label>
      <button id="fetch-history-btn">Verlauf vom Sensor abrufen</button>
      <a id="export-link" href="/api/export.csv">CSV-Export</a>
    </div>
    <p id="history-info" class="muted"></p>
    <canvas id="chart" width="800" height="200"></canvas>
    <table>
      <thead><tr><th>Zeitstempel (geschätzt)</th><th>Temperatur °C</th><th>Luftfeuchte %</th></tr></thead>
      <tbody id="history-body"></tbody>
    </table>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
